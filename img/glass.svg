<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="100%" style="stop-color:#3d59a1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:white;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.3; } }
    .cursor { animation: blink 1.2s step-end infinite; }
    .reflect { animation: pulse 4s ease-in-out infinite; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#glass-grad)" stroke-width="3"/>
  <!-- Terminal window (glass-like with transparency feel) -->
  <rect x="38" y="46" width="180" height="130" rx="8" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5" opacity="0.95"/>
  <!-- Glass reflection -->
  <rect class="reflect" x="38" y="46" width="180" height="130" rx="8" fill="url(#shine)"/>
  <!-- Title bar -->
  <rect x="38" y="46" width="180" height="14" rx="8" fill="#24283b" opacity="0.9"/>
  <rect x="38" y="54" width="180" height="6" fill="#24283b" opacity="0.9"/>
  <circle cx="50" cy="53" r="3" fill="#f7768e" opacity="0.8"/>
  <circle cx="60" cy="53" r="3" fill="#e0af68" opacity="0.8"/>
  <circle cx="70" cy="53" r="3" fill="#9ece6a" opacity="0.8"/>
  <text x="128" y="56" font-family="monospace" font-size="6" fill="#565f89" text-anchor="middle">glass</text>
  <!-- Prompt lines -->
  <text x="46" y="76" font-family="monospace" font-size="7" fill="#9ece6a" opacity="0.7">user@host</text>
  <text x="96" y="76" font-family="monospace" font-size="7" fill="#a9b1d6" opacity="0.5">:~/src$</text>
  <text x="134" y="76" font-family="monospace" font-size="7" fill="#c0caf5" opacity="0.4">vim</text>
  <text x="46" y="88" font-family="monospace" font-size="7" fill="#9ece6a" opacity="0.7">user@host</text>
  <text x="96" y="88" font-family="monospace" font-size="7" fill="#a9b1d6" opacity="0.5">:~/src$</text>
  <text x="134" y="88" font-family="monospace" font-size="7" fill="#c0caf5" opacity="0.4">ls -la</text>
  <!-- ls output -->
  <text x="46" y="100" font-family="monospace" font-size="7" fill="#7aa2f7" opacity="0.4">drwxr-xr-x</text>
  <text x="110" y="100" font-family="monospace" font-size="7" fill="#9ece6a" opacity="0.4">glass*</text>
  <text x="46" y="110" font-family="monospace" font-size="7" fill="#7aa2f7" opacity="0.4">-rw-r--r--</text>
  <text x="110" y="110" font-family="monospace" font-size="7" fill="#c0caf5" opacity="0.4">glass.asm</text>
  <!-- Active prompt -->
  <text x="46" y="124" font-family="monospace" font-size="7" fill="#9ece6a">user@host</text>
  <text x="96" y="124" font-family="monospace" font-size="7" fill="#a9b1d6">:~/src$</text>
  <!-- Blinking cursor -->
  <rect class="cursor" x="134" y="117" width="4" height="9" fill="#f7768e"/>
  <!-- Status bar -->
  <rect x="38" y="138" width="180" height="10" fill="#24283b" opacity="0.8"/>
  <text x="46" y="146" font-family="monospace" font-size="6" fill="#565f89">NORMAL</text>
  <text x="172" y="146" font-family="monospace" font-size="6" fill="#565f89">1:1</text>
  <!-- Annotations -->
  <text x="46" y="162" font-family="monospace" font-size="6" fill="#7aa2f7" opacity="0.3">X11 wire</text>
  <text x="164" y="162" font-family="monospace" font-size="6" fill="#7aa2f7" opacity="0.3">syscall</text>
  <!-- Label -->
  <text x="128" y="202" font-family="monospace" font-size="26" font-weight="bold" fill="url(#glass-grad)" text-anchor="middle" letter-spacing="4">glass</text>
  <text x="128" y="220" font-family="monospace" font-size="7.5" fill="#565f89" text-anchor="middle">pure assembly terminal</text>
</svg>
